# 集團市值 Dashboard v1.3.1
# 每個交易日 16:45（台北）抓收盤市值 → commit 回 repo → 部署 GitHub Pages
name: daily-marketcap

on:
  schedule:
    # GitHub 排程可能延遲數小時或漏跑：設多個備援時間，當天已有收盤資料就自動略過
    - cron: "45 8 * * 1-5"   # 台北 16:45（主要）
    - cron: "17 9 * * 1-5"   # 台北 17:17（備援）
    - cron: "7 11 * * 1-5"   # 台北 19:07（備援）
    - cron: "37 13 * * 1-5"  # 台北 21:37（備援）
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "回補天數（0 = 不回補）"
        required: false
        default: "0"
  push:
    branches: [main]
    paths: ["docs/**", "src/**", "config/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: marketcap
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance
      - name: 決定是否回補
        id: plan
        run: |
          BF="${{ github.event.inputs.backfill_days || '0' }}"
          if [ ! -f data/history.csv ]; then BF=365; fi
          RUN=yes
          if [ "${{ github.event_name }}" = "push" ] && [ -f data/history.csv ]; then RUN=no; fi
          # 排程備援：今天 16:30 後已存過收盤資料就略過
          if [ "${{ github.event_name }}" = "schedule" ] && python3 -c "import json,sys,datetime as d;g=json.load(open('docs/data/latest.json'))['generated'];t=d.datetime.now(d.timezone(d.timedelta(hours=8))).strftime('%Y-%m-%d');sys.exit(0 if g[:10]==t and g[11:16]>='16:30' else 1)" 2>/dev/null; then RUN=no; echo "今天已有收盤資料，略過"; fi
          echo "run=${RUN}" >> $GITHUB_OUTPUT
          echo "bf=$BF" >> $GITHUB_OUTPUT
      - name: 抓取市值
        if: steps.plan.outputs.run == 'yes'
        run: python src/fetch_daily.py --backfill ${{ steps.plan.outputs.bf }}
      - name: Commit 資料
        if: steps.plan.outputs.run == 'yes'
        run: |
          git config user.name "marketcap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 市值存檔"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
