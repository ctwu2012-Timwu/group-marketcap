<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>集團市值監控</title>
<meta name="description" content="五大次集團市值，統一以新台幣計；每日收盤存檔，盤中即時更新。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230A1F4D'/%3E%3Crect x='14' y='14' width='6' height='36' rx='2' fill='%23D7000F'/%3E%3Cpath d='M26 44l8-10 7 5 9-15' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230A1F4D'/%3E%3Crect x='14' y='14' width='6' height='36' rx='2' fill='%23D7000F'/%3E%3Cpath d='M26 44l8-10 7 5 9-15' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --line:#DDE3EE; --line-2:#EEF1F6; --ink:#0E1A33; --muted:#5A6782;
  --navy:#0A1F4D; --navy-2:#0A2463; --brand-red:#D7000F; --up:#D7000F; --down:#0B7A3E;
  --live-bg:#0F3B2A; --live-bd:#1F8A5B; --live-dot:#34D07F;
  --close-bg:#13306B; --close-bd:#3E67C2; --close-dot:#7FA4F0;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--navy-2)}a:hover{color:var(--brand-red)}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
.wrap{max-width:1440px;margin:0 auto}
header.top{background:var(--navy);color:#fff}
header.top .wrap{padding:20px 40px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;flex:1 1 auto;min-width:240px}
.brand .bar{width:6px;height:36px;background:var(--brand-red);border-radius:2px}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em}
.brand .sub{font-size:13px;color:#B9C6E4}
.pill{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid}
.pill small{font-size:12px;font-weight:400}
.pill.live{background:var(--live-bg);border-color:var(--live-bd)} .pill.live small{color:#9FE0BD}
.pill.closed{background:var(--close-bg);border-color:var(--close-bd)} .pill.closed small{color:#B9C6E4}
.pill.loading{background:#1B2A4D;border-color:#3E5B9A}
.dot{width:10px;height:10px;border-radius:50%}
.pill.live .dot{background:var(--live-dot);box-shadow:0 0 0 0 rgba(52,208,127,.6);animation:pulse 2s infinite}
.pill.closed .dot{background:var(--close-dot)} .pill.loading .dot{background:#8FA3CC}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,208,127,.55)}70%{box-shadow:0 0 0 8px rgba(52,208,127,0)}100%{box-shadow:0 0 0 0 rgba(52,208,127,0)}}
@media (prefers-reduced-motion:reduce){.pill.live .dot{animation:none}}
.btn-refresh{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:8px;border:1px solid #3E5B9A;background:transparent;color:#fff;font-size:14px}
.btn-refresh:hover{background:#13306B}
.btn-refresh.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
section.summary .wrap{padding:24px 40px 0;display:flex;align-items:flex-end;gap:24px 40px;flex-wrap:wrap}
.total-label{font-size:13px;color:var(--muted);font-weight:500}
.total-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.total{font-size:44px;font-weight:600;color:var(--navy);letter-spacing:-.01em}
.fxbox{margin-left:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:6px;background:var(--card);border:1px solid var(--line);font-size:13px}
.chip b{font-weight:600}
.cards{padding:20px 40px 0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card .head{display:flex;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:700;color:#fff;background:var(--navy);padding:3px 8px;border-radius:4px;letter-spacing:.04em}
.card .nm{font-size:14px;font-weight:500;flex:1}
.card .rank{font-size:12px;color:var(--muted)}
.card .tk{font-size:12px;color:var(--muted)}
.card .big{display:flex;align-items:baseline;gap:6px}
.card .big .v{font-size:28px;font-weight:600;color:var(--navy)}
.card .big .u{font-size:13px;color:var(--muted)}
.card .px{display:flex;gap:10px;font-size:13px}
.card .foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:8px}
.card .foot b{color:var(--ink);font-weight:600}
.panels{padding:20px 40px 0;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-size:16px;font-weight:700}
.panel h2 span{font-size:13px;font-weight:400;color:var(--muted)}
.p-trend{grid-column:span 8}.p-rank{grid-column:span 4}
.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px}
.seg button{height:36px;padding:0 14px;border:0;border-radius:6px;background:transparent;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.bar-row{display:flex;flex-direction:column;gap:6px}
.bar-row .l{display:flex;align-items:baseline;gap:8px}
.bar-row .rk{font-size:12px;color:var(--muted);width:18px}
.bar-row .cd{font-size:14px;font-weight:700;width:40px}
.bar-row .n{font-size:13px;color:var(--muted);flex:1}
.bar-row .v{font-size:14px;font-weight:600}
.track{height:10px;background:var(--line-2);border-radius:5px;margin-left:26px}
.fill{height:10px;border-radius:5px;min-width:4px}
.note{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line-2);padding-top:12px}
.tablewrap{padding:20px 40px 0}
.tablebox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tablebox .th{display:flex;align-items:center;padding:16px 20px;gap:12px}
.tablebox .th h2{margin:0;font-size:16px;font-weight:700;flex:1}
.tablebox .th a{display:flex;align-items:center;gap:6px;font-size:13px;text-decoration:none;padding:8px 4px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:980px}
thead tr{background:#F6F8FB;color:var(--muted)}
th{padding:10px 12px;font-weight:500;text-align:right;white-space:nowrap}
td{padding:12px;text-align:right;border-top:1px solid var(--line-2);white-space:nowrap}
th:first-child,td:first-child{padding-left:20px}th:last-child,td:last-child{padding-right:20px}
.tl{text-align:left}
.mkt{font-size:12px;padding:2px 8px;border-radius:4px}
.mkt.open{background:#E6F6EE;color:#0B6A37}.mkt.shut{background:var(--line-2);color:#3A4660}
footer.foot .wrap{padding:16px 40px 28px;display:flex;flex-wrap:wrap;gap:8px 24px;font-size:12px;color:var(--muted)}
.err{margin:16px 40px 0;padding:12px 16px;border-radius:8px;background:#FDECEC;color:#8A1018;font-size:13px;display:none}
.skel{color:transparent;background:linear-gradient(90deg,#EEF1F6,#F6F8FB,#EEF1F6);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:4px}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:1100px){
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .p-trend,.p-rank{grid-column:span 12}
}
@media (max-width:640px){
  header.top .wrap{padding:16px}
  .brand h1{font-size:19px}.brand .sub{display:none}
  .btn-refresh span{display:none}.btn-refresh{width:44px;justify-content:center;padding:0}
  section.summary .wrap,.cards,.panels,.tablewrap,footer.foot .wrap{padding-left:16px;padding-right:16px}
  .err{margin-left:16px;margin-right:16px}
  .total{font-size:34px}
  .fxbox{margin-left:0}
  .cards{grid-template-columns:minmax(0,1fr);gap:10px}
  .card{padding:14px 16px}
  .card .big .v{font-size:24px}
  .seg{width:100%}.seg button{flex:1}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><div class="bar"></div><div>
    <h1>集團市值監控</h1>
    <div class="sub">Group Market Capitalization · 五大次集團 · 統一以新台幣計</div>
  </div></div>
  <div id="status" class="pill loading" role="status" aria-live="polite"><span class="dot"></span><span>資料載入中…</span></div>
  <button id="refresh" class="btn-refresh" type="button" aria-label="立即更新">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    <span>立即更新</span>
  </button>
</div></header>

<div id="err" class="err" role="alert"></div>

<section class="summary"><div class="wrap">
  <div>
    <div class="total-label">集團合計市值（新台幣）</div>
    <div class="total-row">
      <span id="total" class="num total skel">0.00 兆</span>
      <span id="totalChg" class="num" style="font-size:16px;font-weight:600"></span>
      <span id="totalDelta" style="font-size:13px;color:var(--muted)"></span>
    </div>
  </div>
  <div class="fxbox">
    <div id="fxTime" style="font-size:12px;color:var(--muted)"></div>
    <div id="fxChips" style="display:flex;gap:8px"></div>
  </div>
</div></section>

<section id="cards" class="cards" aria-label="各單位市值"></section>

<section class="panels">
  <div class="panel p-trend">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <h2 style="flex:1">相對表現 <span>（期初 = 0%）</span></h2>
      <div class="seg" role="group" aria-label="期間">
        <button type="button" data-range="30" aria-pressed="false">30 天</button>
        <button type="button" data-range="90" aria-pressed="true">90 天</button>
        <button type="button" data-range="365" aria-pressed="false">1 年</button>
      </div>
    </div>
    <div id="chart"></div>
    <div id="legend" class="legend"></div>
  </div>
  <div class="panel p-rank">
    <h2>市值排行 <span>（億新台幣）</span></h2>
    <div id="bars" style="display:flex;flex-direction:column;gap:16px"></div>
    <div id="rankNote" class="note"></div>
  </div>
</section>

<section class="tablewrap"><div class="tablebox">
  <div class="th"><h2>明細</h2>
    <a href="https://github.com/ctwu2012-Timwu/group-marketcap/blob/main/data/history.csv" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      歷史資料（history.csv）</a>
  </div>
  <div class="scroll"><table>
    <thead><tr>
      <th class="tl" scope="col">單位</th><th class="tl" scope="col">公司 / 代碼</th><th class="tl" scope="col">市場狀態</th>
      <th scope="col">股價（原幣）</th><th scope="col">漲跌</th><th scope="col">股數（億股）</th>
      <th scope="col">原幣市值（億）</th><th scope="col">匯率</th><th scope="col">台幣市值（億）</th><th scope="col">占比</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table></div>
</div></section>

<footer class="foot"><div class="wrap">
  <span>股價：Yahoo Finance · 匯率：臺灣銀行牌告即期中價</span>
  <span>每個交易日 16:45 由 GitHub Actions 存檔 · 盤中即時資料經 Tailscale 由 Mac Studio 提供</span>
  <span id="bfNote"></span>
  <span style="flex:1"></span>
  <span id="ver">v1.0.2</span>
</div></footer>

<script>
(() => {
  "use strict";
  const LIVE_POLL_MS = 60_000, LIVE_RETRY_MS = 300_000, LIVE_TIMEOUT_MS = 6_000;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const PFX = { TWD: "NT$", HKD: "HK$", CNY: "¥", USD: "US$" };
  const state = { cfg: {}, history: null, latest: null, live: null, range: 90, liveTimer: null };

  // ---------- 格式化
  const yi = (v) => Math.round(v / 1e8).toLocaleString("zh-TW");
  const trillion = (v) => (v / 1e12).toFixed(2) + " 兆";
  const price = (cur, v) => (PFX[cur] || "") + Number(v).toLocaleString("zh-TW", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const pct = (v, d = 2) => (v > 0 ? "▲ " : v < 0 ? "▼ " : "") + Math.abs(v).toFixed(d) + "%";
  const chgColor = (v) => (v > 0 ? "var(--up)" : v < 0 ? "var(--down)" : "var(--muted)");

  // ---------- 市場開盤判斷（台北時間）
  function tpeNow() {
    const s = new Date().toLocaleString("en-US", { timeZone: "Asia/Taipei", hour12: false });
    return new Date(s);
  }
  const SESSIONS = { TWSE: [[900, 1330]], SSE: [[930, 1130], [1300, 1500]], HKEX: [[930, 1200], [1300, 1600]] };
  function marketOpen(ex) {
    const t = tpeNow(), d = t.getDay();
    if (d === 0 || d === 6) return false;
    const hm = t.getHours() * 100 + t.getMinutes();
    return (SESSIONS[ex] || []).some(([a, b]) => hm >= a && hm <= b);
  }

  // ---------- 資料載入
  async function getJSON(url, opts = {}) {
    const r = await fetch(url, { cache: "no-store", ...opts });
    if (!r.ok) throw new Error(url + " → HTTP " + r.status);
    return r.json();
  }
  function liveUrl() {
    const q = new URLSearchParams(location.search).get("live");
    if (q !== null) { try { localStorage.setItem("liveUrl", q); } catch (e) {} return q; }
    try { const s = localStorage.getItem("liveUrl"); if (s) return s; } catch (e) {}
    return state.cfg.liveUrl || "";
  }
  async function loadDaily() {
    const [cfg, hist, latest] = await Promise.all([
      getJSON("config.json").catch(() => ({})),
      getJSON("data/history.json"),
      getJSON("data/latest.json"),
    ]);
    state.cfg = cfg; state.history = hist; state.latest = latest;
  }
  async function tryLive() {
    const base = liveUrl().replace(/\/+$/, "");
    if (!base) { state.live = null; return false; }
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), LIVE_TIMEOUT_MS);
    try {
      const d = await getJSON(base + "/api/live", { signal: ctl.signal, mode: "cors" });
      if (!d.rows || !d.rows.length) throw new Error("empty");
      state.live = d; return true;
    } catch (e) { state.live = null; return false; }
    finally { clearTimeout(t); }
  }

  // ---------- 畫面
  function unitMeta() {
    const m = {}; (state.history?.units || state.latest?.units || []).forEach((u) => (m[u.code] = u)); return m;
  }
  function currentRows() {
    const src = state.live || state.latest;
    return (src?.rows || []).slice().sort((a, b) => b.mcap_twd - a.mcap_twd);
  }
  function renderStatus() {
    const el = $("status");
    if (state.live) {
      el.className = "pill live";
      el.innerHTML = `<span class="dot"></span><span>即時 · <span class="num">${esc(state.live.generated.slice(11, 19))}</span> 更新</span><small>每 60 秒刷新 · Mac Studio</small>`;
    } else if (state.latest) {
      const g = state.latest.generated || "";
      el.className = "pill closed";
      el.innerHTML = `<span class="dot"></span><span>收盤資料 · <span class="num">${esc(g.slice(0, 10).replace(/-/g, "/"))}</span></span><small>${liveUrl() ? "即時服務未連線" : "未設定即時服務"}</small>`;
    }
  }
  function renderSummary(rows) {
    const total = rows.reduce((s, r) => s + Number(r.mcap_twd), 0);
    const prev = rows.every((r) => r.prev_mcap_twd !== "" && r.prev_mcap_twd != null)
      ? rows.reduce((s, r) => s + Number(r.prev_mcap_twd), 0) : null;
    $("total").textContent = trillion(total); $("total").classList.remove("skel");
    if (prev) {
      const p = (total / prev - 1) * 100, dv = total - prev;
      $("totalChg").textContent = pct(p); $("totalChg").style.color = chgColor(p);
      $("totalDelta").innerHTML = `較前一交易日 <span class="num">${dv >= 0 ? "+" : "−"}${yi(Math.abs(dv))} 億</span>`;
    }
    const src = state.live || state.latest; const fx = src?.fx || {};
    $("fxChips").innerHTML = ["HKD", "CNY"].filter((c) => fx[c]).map((c) =>
      `<div class="chip">${c} <b class="num">${Number(fx[c].mid).toFixed(3)}</b></div>`).join("");
    $("fxTime").innerHTML = `${esc(fx._source || "")} <span class="num">${esc((fx._time || "").slice(5).replace("-", "/"))}</span>`;
    return total;
  }
  function sameDay() {
    const h = state.history; return !!(h && state.live && h.dates[h.dates.length - 1] === state.live.generated.slice(0, 10));
  }
  function sparkPoints(code) {
    const h = state.history; if (!h) return "";
    let s = (h.mcap_twd[code] || []).filter((v) => v != null).slice(-20);
    if (state.live) { const r = state.live.rows.find((x) => x.code === code); if (r) { if (sameDay()) s = s.slice(0, -1); s = s.concat([r.mcap_twd]); } }
    if (s.length < 2) return "";
    const mn = Math.min(...s), mx = Math.max(...s), rg = mx - mn || 1;
    return s.map((v, i) => `${(i / (s.length - 1) * 120).toFixed(1)},${(28 - (v - mn) / rg * 24).toFixed(1)}`).join(" ");
  }
  function renderCards(rows, total) {
    const meta = unitMeta();
    $("cards").innerHTML = rows.map((r, i) => {
      const c = r.chg_pct === "" ? 0 : Number(r.chg_pct);
      return `<article class="card">
        <div class="head"><span class="tag">${esc(r.code)}</span><span class="nm">${esc(r.name)}</span><span class="num rank">#${i + 1}</span></div>
        <div class="num tk">${esc(r.ticker)}</div>
        <div class="big"><span class="num v">${yi(r.mcap_twd)}</span><span class="u">億</span></div>
        <div class="px"><span class="num">${price(r.currency, r.close)}</span><span class="num" style="font-weight:600;color:${chgColor(c)}">${r.chg_pct === "" ? "—" : pct(c)}</span></div>
        <svg width="100%" height="32" viewBox="0 0 120 32" preserveAspectRatio="none" aria-hidden="true"><polyline points="${sparkPoints(r.code)}" fill="none" stroke="${(meta[r.code] || {}).color || "#0A2463"}" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
        <div class="foot"><span>集團占比</span><b class="num">${(r.mcap_twd / total * 100).toFixed(r.mcap_twd / total < 0.01 ? 2 : 1)}%</b></div>
      </article>`;
    }).join("");
  }
  function renderBars(rows, total) {
    const meta = unitMeta(), mx = rows[0]?.mcap_twd || 1;
    $("bars").innerHTML = rows.map((r, i) => `<div class="bar-row">
      <div class="l"><span class="num rk">${i + 1}</span><span class="cd">${esc(r.code)}</span><span class="n">${esc(r.name)}</span><span class="num v">${yi(r.mcap_twd)}</span></div>
      <div class="track"><div class="fill" style="width:${(r.mcap_twd / mx * 100).toFixed(2)}%;background:${(meta[r.code] || {}).color}"></div></div></div>`).join("");
    if (rows.length >= 2) {
      const top2 = (rows[0].mcap_twd + rows[1].mcap_twd) / total * 100;
      $("rankNote").textContent = `${rows[0].code} 與 ${rows[1].code} 合計占集團 ${top2.toFixed(1)}%。`;
    }
  }
  function renderTable(rows, total) {
    const meta = unitMeta(), cfgEx = { "601138.SS": "SSE", "2317.TW": "TWSE", "2258.TW": "TWSE", "6088.HK": "HKEX", "2038.HK": "HKEX" };
    $("tbody").innerHTML = rows.map((r) => {
      const c = r.chg_pct === "" ? 0 : Number(r.chg_pct);
      const open = state.live && marketOpen(cfgEx[r.ticker]);
      const mk = state.live ? (open ? ["open", "盤中"] : ["shut", "休市"]) : ["shut", "已收盤"];
      return `<tr>
        <td class="tl" style="font-weight:700;color:var(--navy)">${esc(r.code)}</td>
        <td class="tl">${esc(r.name)} <span class="num" style="color:var(--muted);font-size:12px">${esc(r.ticker)}</span></td>
        <td class="tl"><span class="mkt ${mk[0]}">${mk[1]}</span></td>
        <td class="num">${price(r.currency, r.close)}</td>
        <td class="num" style="font-weight:600;color:${chgColor(c)}">${r.chg_pct === "" ? "—" : pct(c)}</td>
        <td class="num">${(r.shares / 1e8).toFixed(2)}</td>
        <td class="num">${(PFX[r.currency] || "") + yi(r.mcap_local)}</td>
        <td class="num">${Number(r.fx).toFixed(3)}</td>
        <td class="num" style="font-weight:600;color:var(--navy)">${yi(r.mcap_twd)}</td>
        <td class="num">${(r.mcap_twd / total * 100).toFixed(2)}%</td></tr>`;
    }).join("");
  }
  function renderChart() {
    const h = state.history; if (!h || !h.dates.length) return;
    const meta = unitMeta();
    const lastDate = new Date(h.dates[h.dates.length - 1] + "T00:00:00+08:00");
    const from = new Date(lastDate.getTime() - state.range * 86400e3);
    let idx = h.dates.map((d, i) => [d, i]).filter(([d]) => new Date(d + "T00:00:00+08:00") >= from).map(([, i]) => i);
    if (idx.length < 2) idx = h.dates.map((_, i) => i);
    if (state.live && sameDay() && idx.length > 2) idx = idx.slice(0, -1);
    const dates = idx.map((i) => h.dates[i]);
    const liveOn = !!state.live;
    const series = h.units.map((u) => {
      let vals = idx.map((i) => h.mcap_twd[u.code][i]);
      if (liveOn) { const r = state.live.rows.find((x) => x.code === u.code); if (r) vals = vals.concat([r.mcap_twd]); }
      const base = vals.find((v) => v != null);
      return { u, pts: vals.map((v) => (v == null || !base ? null : (v / base - 1) * 100)) };
    });
    const n = dates.length + (liveOn ? 1 : 0);
    const all = series.flatMap((s) => s.pts.filter((v) => v != null));
    let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
    const span = hi - lo || 1, step = [1, 2, 5, 10, 20, 25, 50, 100].find((s) => span / s <= 6) || 200;
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const narrow = window.innerWidth < 640;
    const W = narrow ? 420 : 820, H = narrow ? 300 : 290, L = 44, R = narrow ? 44 : 60, T = 16, B = 44;
    const x = (i) => L + (n <= 1 ? 0 : i / (n - 1) * (W - L - R));
    const y = (v) => T + (hi - v) / (hi - lo || 1) * (H - T - B);
    let g = "";
    for (let v = lo; v <= hi + 1e-9; v += step) {
      g += `<line x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}" stroke="${v === 0 ? "#C9D2E3" : "#EEF1F6"}"/>`;
      g += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v)}%</text>`;
    }
    const ticks = narrow ? 3 : 6;
    for (let k = 0; k <= ticks; k++) {
      const i = Math.round(k / ticks * (dates.length - 1)); const d = dates[i]; if (!d) continue;
      g += `<text x="${x(i)}" y="${H - 18}" text-anchor="middle">${d.slice(5).replace("-", "/")}</text>`;
    }
    let lines = "", labels = [];
    series.forEach(({ u, pts }) => {
      const p = pts.map((v, i) => (v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`)).filter(Boolean).join(" ");
      lines += `<polyline fill="none" stroke="${u.color}" stroke-width="2.5" stroke-linejoin="round" points="${p}"/>`;
      const lastI = pts.length - 1, lv = pts[lastI];
      if (lv != null) labels.push({ u, yy: y(lv), xx: x(lastI), lv });
    });
    labels.sort((a, b) => a.yy - b.yy);
    labels.forEach((l) => (l.ty = l.yy));
    for (let i = 1; i < labels.length; i++) if (labels[i].ty - labels[i - 1].ty < 14) labels[i].ty = labels[i - 1].ty + 14;
    const lab = labels.map((l) => `<circle cx="${l.xx}" cy="${l.yy}" r="4" fill="${l.u.color}"/><text x="${l.xx + 8}" y="${(l.ty ?? l.yy) + 4}" fill="${l.u.color}" font-weight="700" font-family="Noto Sans TC,sans-serif">${esc(l.u.code)}</text>`).join("");
    const liveMark = liveOn ? `<line x1="${x(n - 1)}" y1="${T}" x2="${x(n - 1)}" y2="${H - B}" stroke="#34D07F" stroke-dasharray="3 3"/><text x="${x(n - 1) - 4}" y="${T - 4}" text-anchor="end" fill="#1F8A5B" font-size="11" font-family="Noto Sans TC,sans-serif">今日即時點</text>` : "";
    $("chart").innerHTML = `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="${state.range} 天相對表現走勢"><g font-family="IBM Plex Mono,monospace" font-size="11" fill="#5A6782">${g}</g>${liveMark}${lines}<g font-size="12">${lab}</g></svg>`;
    $("legend").innerHTML = series.map(({ u, pts }) => {
      const lv = pts[pts.length - 1];
      return `<span style="color:${u.color}"><i style="background:${u.color}"></i>${esc(u.code)} ${esc(u.name)} <span class="num" style="font-weight:600">${lv == null ? "" : (lv >= 0 ? "+" : "−") + Math.abs(lv).toFixed(1) + "%"}</span></span>`;
    }).join("");
    const firstClose = h.method.indexOf("close");
    $("bfNote").textContent = firstClose > 0 ? `${h.dates[firstClose]} 前的趨勢為回補估算（收盤價 × 目前股數）` : "";
  }
  function renderAll() {
    const rows = currentRows(); if (!rows.length) return;
    renderStatus();
    const total = renderSummary(rows);
    renderCards(rows, total); renderBars(rows, total); renderTable(rows, total); renderChart();
  }
  function showErr(msg) { const e = $("err"); e.textContent = msg; e.style.display = msg ? "block" : "none"; }

  // ---------- 流程
  async function cycleLive() {
    clearTimeout(state.liveTimer);
    const ok = await tryLive();
    renderAll();
    state.liveTimer = setTimeout(cycleLive, ok ? LIVE_POLL_MS : LIVE_RETRY_MS);
  }
  async function refresh() {
    const b = $("refresh"); b.classList.add("spin"); b.disabled = true;
    try { await loadDaily(); showErr(""); } catch (e) { showErr("每日資料載入失敗：" + e.message); }
    await cycleLive();
    b.classList.remove("spin"); b.disabled = false;
  }
  document.querySelectorAll(".seg button").forEach((btn) => btn.addEventListener("click", () => {
    state.range = Number(btn.dataset.range);
    document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === btn)));
    renderChart();
  }));
  $("refresh").addEventListener("click", refresh);
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(renderChart, 200); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) cycleLive(); });
  refresh();
})();
</script>
</body>
</html>
